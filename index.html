<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夹挑棋</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #2b2b2b;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            color: #eee;
            user-select: none;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 6px;
            letter-spacing: 6px;
            color: #f0d060;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .score-bar {
            display: flex;
            gap: 36px;
            margin-bottom: 6px;
            font-size: 18px;
        }
        .score-bar .side {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 16px;
            border-radius: 6px;
            transition: background 0.3s;
        }
        .score-bar .side.active {
            background: rgba(255, 255, 255, 0.1);
        }
        .dot {
            display: inline-block;
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }
        .dot.black { background: #333; border: 2px solid #666; }
        .dot.white { background: #eee; border: 2px solid #aaa; }
        #status {
            font-size: 20px;
            margin-bottom: 10px;
            height: 32px;
            line-height: 32px;
            color: #ccc;
        }
        .mode-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .mode-btn {
            padding: 6px 14px;
            border: 1px solid #777;
            background: #3a3a3a;
            color: #e6e6e6;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
        }
        .mode-btn:hover { background: #4a4a4a; }
        .mode-btn.active {
            background: #5c8f2f;
            border-color: #8bc34a;
            color: #fff;
        }
        .online-panel {
            display: none;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 520px;
        }
        .online-panel.show { display: flex; }
        .online-panel input {
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid #666;
            background: #242424;
            color: #eee;
            font-size: 13px;
            font-family: inherit;
            width: 130px;
        }
        .online-panel input#serverInput { width: 180px; }
        .online-panel button {
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            background: #546e7a;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
        }
        .online-panel button:hover { background: #455a64; }
        .online-tip {
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: #bdbdbd;
        }
        .adv-toggle {
            color: #90a4ae;
            cursor: pointer;
            font-size: 12px;
            user-select: none;
            text-decoration: none;
        }
        .adv-toggle:hover { color: #b0bec5; }
        .adv-hidden { display: none !important; }
        #gameCanvas {
            cursor: pointer;
            border-radius: 10px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.6);
        }
        .btn-row {
            margin-top: 14px;
            display: flex;
            gap: 16px;
        }
        .btn-row button {
            padding: 10px 28px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-row button:active { transform: scale(0.96); }
        #restartBtn { background: #4CAF50; color: #fff; }
        #restartBtn:hover { background: #43a047; }
        #surrenderBtn { background: #e53935; color: #fff; }
        #surrenderBtn:hover { background: #c62828; }
        /* Result Panel */
        #overlay {
            display: none;
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 100;
        }
        #overlay.show { display: block; }
        .modal {
            background: rgba(45,45,45,0.95);
            padding: 16px 18px;
            border-radius: 10px;
            text-align: left;
            min-width: 260px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.45);
            border: 1px solid rgba(255,255,255,0.16);
        }
        .modal h2 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #f0d060;
        }
        .modal button {
            padding: 8px 16px;
            font-size: 14px;
            background: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }
        .modal button:hover { background: #43a047; }
    </style>
</head>
<body>

<h1>夹 挑 棋</h1>

<div class="score-bar">
    <div class="side" id="blackSide">
        <i class="dot black"></i>
        <span>黑方: <b id="blackCount">5</b></span>
    </div>
    <div class="side" id="whiteSide">
        <i class="dot white"></i>
        <span>白方: <b id="whiteCount">5</b></span>
    </div>
</div>

<div id="status">黑方走棋</div>

<div class="mode-row">
    <button class="mode-btn active" id="pvpModeBtn">本地双人</button>
    <button class="mode-btn" id="aiModeBtn">人机对战</button>
    <button class="mode-btn" id="onlineModeBtn">在线对战</button>
</div>

<div class="online-panel" id="onlinePanel">
    <input id="roomInput" placeholder="房间号（如 1001）" />
    <button id="connectBtn">连接房间</button>
    <button id="disconnectBtn">断开连接</button>
    <a id="advToggle" class="adv-toggle">高级设置 ▾</a>
    <input id="serverInput" class="adv-hidden" placeholder="ws://127.0.0.1:8080" />
    <div class="online-tip" id="onlineTip">未连接</div>
</div>

<canvas id="gameCanvas"></canvas>

<div class="btn-row">
    <button id="restartBtn">重新开始</button>
    <button id="surrenderBtn">认 输</button>
</div>

<div id="overlay">
    <div class="modal">
        <h2 id="modalTitle"></h2>
        <button id="playAgainBtn">再来一局</button>
    </div>
</div>

<script>
// ========== Constants ==========
const EMPTY = 0, BLACK = 1, WHITE = 2;
const GRID = 5;
const CELL = 100;
const PAD = 50;
const RADIUS = 22;
const CANVAS_CSS = PAD * 2 + (GRID - 1) * CELL; // 500
const ANIM_STEP_START_DELAY = 260;
const ANIM_FLASH_COUNT = 6;
const ANIM_FLASH_INTERVAL = 200;
const ANIM_CONVERT_HOLD = 520;
const ANIM_STEP_GAP = 360;

// ========== DOM ==========
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const blackCountEl = document.getElementById('blackCount');
const whiteCountEl = document.getElementById('whiteCount');
const blackSideEl = document.getElementById('blackSide');
const whiteSideEl = document.getElementById('whiteSide');
const overlayEl = document.getElementById('overlay');
const modalTitleEl = document.getElementById('modalTitle');
const pvpModeBtn = document.getElementById('pvpModeBtn');
const aiModeBtn = document.getElementById('aiModeBtn');
const onlineModeBtn = document.getElementById('onlineModeBtn');
const onlinePanelEl = document.getElementById('onlinePanel');
const serverInputEl = document.getElementById('serverInput');
const roomInputEl = document.getElementById('roomInput');
const connectBtnEl = document.getElementById('connectBtn');
const disconnectBtnEl = document.getElementById('disconnectBtn');
const onlineTipEl = document.getElementById('onlineTip');
const advToggleEl = document.getElementById('advToggle');

// Hi-DPI
const dpr = window.devicePixelRatio || 1;
canvas.width = CANVAS_CSS * dpr;
canvas.height = CANVAS_CSS * dpr;
canvas.style.width = CANVAS_CSS + 'px';
canvas.style.height = CANVAS_CSS + 'px';
ctx.scale(dpr, dpr);

// ========== Lines (game coords: y=0 bottom, y=4 top) ==========
const allLines = [];
const ptLines = {}; // "x,y" -> [{li, pi}]

function buildLines() {
    allLines.length = 0;
    for (const k in ptLines) delete ptLines[k];

    // Horizontal (5)
    for (let y = 0; y < GRID; y++) {
        const line = [];
        for (let x = 0; x < GRID; x++) line.push([x, y]);
        allLines.push(line);
    }
    // Vertical (5)
    for (let x = 0; x < GRID; x++) {
        const line = [];
        for (let y = 0; y < GRID; y++) line.push([x, y]);
        allLines.push(line);
    }
    // Diagonal '\' in game coords (x+, y-)
    allLines.push([[0,4],[1,3],[2,2],[3,1],[4,0]]);
    allLines.push([[0,2],[1,1],[2,0]]);
    allLines.push([[2,4],[3,3],[4,2]]);
    // Diagonal '/' in game coords (x+, y+)
    allLines.push([[0,0],[1,1],[2,2],[3,3],[4,4]]);
    allLines.push([[0,2],[1,3],[2,4]]);
    allLines.push([[2,0],[3,1],[4,2]]);

    for (let li = 0; li < allLines.length; li++) {
        const line = allLines[li];
        for (let pi = 0; pi < line.length; pi++) {
            const k = line[pi][0] + ',' + line[pi][1];
            if (!ptLines[k]) ptLines[k] = [];
            ptLines[k].push({ li, pi });
        }
    }
}

// ========== State ==========
let board, curPlayer, selPiece, validMoves, lastMove, gameOver;
let isAnimating = false;
let animCapture = null;
let audioCtx = null;
let winAnim = null;
let winAnimRaf = null;
let gameMode = 'pvp';
const aiColor = WHITE;
let aiThinking = false;
let onlineSocket = null;
let onlineConnected = false;
let onlineRoomId = '';
let onlinePlayerColor = null;
let onlinePlayersCount = 0;
// 断线重连状态
let manualClose = false;        // 用户主动断开/切模式时禁止自动重连
let reconnectAttempts = 0;      // 已重连尝试次数
let reconnectTimer = null;      // 重连定时器
let reconnectRoomId = '';       // 重连要加入的房间号
let lastPongAt = 0;             // 最近一次收到 pong 的时间
let pingTimer = null;           // 客户端心跳定时器

const RECONNECT_MAX_ATTEMPTS = 10;  // 最多重连 10 次
const PING_INTERVAL = 10000;        // 每 10s 发一次应用层心跳
const PONG_TIMEOUT = 20000;         // 20s 无 pong 视为死连接

// 自动推导 WebSocket 地址：用户已通过 URL 访问了本服务器，无需再输入。
// 规则：
//  - Electron 桌面版 (file://)        → ws://127.0.0.1:8080（桌面应用内置 WS 服务）
//  - 80/443/8080 端口（生产部署）      → 同源 + /ws（Nginx 反代 或 server.js 单端口）
//  - 其他端口（本地静态服务器开发场景） → 同机 8080（online-server.js 默认端口）
function deriveWsUrl() {
    if (location.protocol === 'file:') return 'ws://127.0.0.1:8080';
    const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
    const port = Number(location.port || (location.protocol === 'https:' ? 443 : 80));
    if (port === 80 || port === 443 || port === 8080) {
        return `${scheme}://${location.host}/ws`;
    }
    return `${scheme}://${location.hostname || '127.0.0.1'}:8080`;
}

const DEFAULT_WS_URL = deriveWsUrl();
serverInputEl.value = DEFAULT_WS_URL;

function setOnlineTip(text) {
    onlineTipEl.textContent = text;
}

function setOnlineConnected(connected) {
    onlineConnected = connected;
    connectBtnEl.disabled = connected;
    disconnectBtnEl.disabled = !connected;
}

function closeOnlineSocket() {
    if (onlineSocket) {
        onlineSocket.onopen = null;
        onlineSocket.onmessage = null;
        onlineSocket.onclose = null;
        onlineSocket.onerror = null;
        onlineSocket.close();
        onlineSocket = null;
    }
    setOnlineConnected(false);
    onlineRoomId = '';
    onlinePlayerColor = null;
    onlinePlayersCount = 0;
}

function normalizeWsUrl(raw) {
    const text = (raw || '').trim();
    if (!text) return DEFAULT_WS_URL;
    if (/^wss?:\/\//i.test(text)) return text;
    return `${location.protocol === 'https:' ? 'wss' : 'ws'}://${text}`;
}

function maybeScheduleAi() {
    if (gameMode === 'ai') {
        triggerAiMoveIfNeeded();
    }
}

async function applyRemoteMove(move) {
    if (gameOver) return;
    isAnimating = true;
    aiThinking = false;
    selPiece = null;
    validMoves = [];
    updateUI();
    draw();
    await doMove(move.fx, move.fy, move.tx, move.ty);
    isAnimating = false;
    if (!gameOver) updateUI();
    draw();
}

function handleOnlineMessage(payload) {
    if (!payload || typeof payload !== 'object') return;

    if (payload.type === 'joined') {
        // 连接成功（首次或重连）：清零重试计数、取消待执行的重连定时器
        reconnectAttempts = 0;
        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
        onlinePlayerColor = payload.color;
        onlineRoomId = payload.roomId;
        onlinePlayersCount = payload.players || 1;
        const colorName = onlinePlayerColor === BLACK ? '黑方' : '白方';
        setOnlineTip(`已进入房间 ${onlineRoomId}，你是${colorName}`);
        if (payload.board) {
            board = payload.board;
            curPlayer = payload.currentPlayer;
            selPiece = null;
            validMoves = [];
            lastMove = null;
            gameOver = false;
            isAnimating = false;
            aiThinking = false;
            animCapture = null;
            overlayEl.classList.remove('show');
            updatePieceCounts();
            updateUI();
            draw();
        }
        return;
    }

    if (payload.type === 'room-update') {
        onlinePlayersCount = payload.players || 0;
        const waitText = onlinePlayersCount < 2 ? '（等待另一位玩家加入）' : '';
        setOnlineTip(`房间 ${onlineRoomId} 在线人数：${onlinePlayersCount}/2 ${waitText}`.trim());
        updateUI();
        return;
    }

    if (payload.type === 'move') {
        applyRemoteMove(payload.move);
        return;
    }

    if (payload.type === 'restart') {
        resetBoard();
        setOnlineTip(`房间 ${onlineRoomId}：对局已重开`);
        return;
    }

    if (payload.type === 'surrender') {
        const winnerPiece = payload.winnerPiece;
        endGame(payload.message || '对方认输，你获胜！', winnerPiece);
        draw();
        return;
    }

    if (payload.type === 'error') {
        setOnlineTip(`连接失败：${payload.message || '未知错误'}`);
        return;
    }

    if (payload.type === 'peer-left') {
        setOnlineTip(`房间 ${onlineRoomId}：对方已离开，等待重连`);
        return;
    }
}

function sendOnlineMessage(payload) {
    if (!onlineSocket || onlineSocket.readyState !== WebSocket.OPEN) return;
    onlineSocket.send(JSON.stringify(payload));
}

// ========== 心跳与自动重连 ==========

// 客户端应用层心跳：浏览器无法发协议级 ping，用业务消息探测连接存活性
function startPingTimer() {
    stopPingTimer();
    pingTimer = setInterval(() => {
        if (!onlineConnected || !onlineSocket) return;
        if (Date.now() - lastPongAt > PONG_TIMEOUT) {
            setOnlineTip('连接超时，正在重连...');
            const sock = onlineSocket;
            if (sock) sock.close(); // 触发 onclose → 自动重连
            return;
        }
        sendOnlineMessage({ type: 'ping' });
    }, PING_INTERVAL);
}

function stopPingTimer() {
    if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
}

// 建立一条新连接并加入房间（首次连接与断线重连共用）
function openSocket(wsUrl, roomId) {
    const socket = new WebSocket(wsUrl);
    onlineSocket = socket;

    socket.onopen = () => {
        if (onlineSocket !== socket) return;
        setOnlineConnected(true);
        lastPongAt = Date.now();
        setOnlineTip('已连接服务器，加入房间中...');
        sendOnlineMessage({ type: 'join', roomId });
    };

    socket.onmessage = (event) => {
        if (onlineSocket !== socket) return;
        try {
            const payload = JSON.parse(event.data);
            if (payload.type === 'pong') { lastPongAt = Date.now(); return; }
            handleOnlineMessage(payload);
        } catch (err) {
            setOnlineTip('收到无效消息');
        }
    };

    socket.onerror = () => {
        if (onlineSocket !== socket) return;
        setOnlineTip('连接出错，请检查服务器地址');
    };

    socket.onclose = () => {
        if (onlineSocket !== socket) return;
        closeOnlineSocket();
        if (gameMode === 'online' && !manualClose && reconnectRoomId) {
            scheduleReconnect();
        } else if (gameMode === 'online') {
            setOnlineTip('连接已断开');
        }
        updateUI();
    };
}

// 断线自动重连（指数退避：1s, 2s, 4s... 上限 10s，最多 10 次）
function scheduleReconnect() {
    if (reconnectTimer) return;
    if (reconnectAttempts >= RECONNECT_MAX_ATTEMPTS) {
        setOnlineTip('重连失败，请点击「连接房间」重新加入');
        reconnectAttempts = 0;
        return;
    }
    const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 10000);
    reconnectAttempts++;
    setOnlineTip(`连接断开，${Math.round(delay / 1000)} 秒后自动重连（第 ${reconnectAttempts} 次）...`);
    reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        if (gameMode !== 'online' || manualClose) return;
        setOnlineTip('正在重连...');
        openSocket(normalizeWsUrl(serverInputEl.value), reconnectRoomId);
    }, delay);
}

// 用户主动断开（断开按钮/切模式）：停止自动重连
function userDisconnect() {
    manualClose = true;
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    reconnectAttempts = 0;
    closeOnlineSocket();
}

function connectOnlineRoom() {
    if (gameMode !== 'online') {
        setOnlineTip('请先切换到在线对战模式');
        return;
    }

    const roomId = (roomInputEl.value || '').trim();
    if (!roomId) {
        setOnlineTip('请先输入房间号');
        return;
    }

    manualClose = false;
    reconnectAttempts = 0;
    reconnectRoomId = roomId;
    closeOnlineSocket();
    setOnlineTip('连接中...');
    openSocket(normalizeWsUrl(serverInputEl.value), roomId);
}

function resetBoard() {
    board = Array.from({ length: GRID }, () => Array(GRID).fill(EMPTY));
    for (let x = 0; x < GRID; x++) board[x][0] = BLACK;
    for (let x = 0; x < GRID; x++) board[x][4] = WHITE;
    curPlayer = BLACK;
    selPiece = null;
    validMoves = [];
    lastMove = null;
    gameOver = false;
    isAnimating = false;
    aiThinking = false;
    animCapture = null;
    winAnim = null;
    if (winAnimRaf) {
        cancelAnimationFrame(winAnimRaf);
        winAnimRaf = null;
    }
    overlayEl.classList.remove('show');
    updatePieceCounts();
    updateUI();
    draw();
    checkNoMoveLossForCurrentPlayer();
}

function updateModeUI() {
    pvpModeBtn.classList.toggle('active', gameMode === 'pvp');
    aiModeBtn.classList.toggle('active', gameMode === 'ai');
    onlineModeBtn.classList.toggle('active', gameMode === 'online');
    onlinePanelEl.classList.toggle('show', gameMode === 'online');
}

function isAiTurn() {
    return gameMode === 'ai' && curPlayer === aiColor;
}

function isHumanTurn() {
    if (gameMode === 'online') {
        if (!onlineConnected || onlinePlayersCount < 2 || onlinePlayerColor == null) return false;
        return curPlayer === onlinePlayerColor;
    }
    return !isAiTurn();
}

// ========== Coord conversion ==========
function g2s(gx, gy) {
    return [PAD + gx * CELL, PAD + (4 - gy) * CELL];
}

function s2g(sx, sy) {
    const gx = Math.round((sx - PAD) / CELL);
    const gy = Math.round(4 - (sy - PAD) / CELL);
    if (gx < 0 || gx >= GRID || gy < 0 || gy >= GRID) return null;
    const [cx, cy] = g2s(gx, gy);
    if (Math.hypot(sx - cx, sy - cy) > CELL * 0.42) return null;
    return [gx, gy];
}

// ========== Game logic ==========

function getValidMoves(x, y) {
    const moves = [];
    const entries = ptLines[x + ',' + y] || [];
    for (const { li, pi } of entries) {
        const line = allLines[li];
        for (let i = pi + 1; i < line.length; i++) {
            if (board[line[i][0]][line[i][1]] !== EMPTY) break;
            moves.push(line[i]);
        }
        for (let i = pi - 1; i >= 0; i--) {
            if (board[line[i][0]][line[i][1]] !== EMPTY) break;
            moves.push(line[i]);
        }
    }
    return moves;
}

function findCaptures(x, y, player) {
    return findCapturesOnBoard(board, x, y, player);
}

function findCapturesOnBoard(boardState, x, y, player) {
    const enemy = player === BLACK ? WHITE : BLACK;
    const caps = [];
    const entries = ptLines[x + ',' + y] || [];

    for (const { li, pi } of entries) {
        const L = allLines[li];

        // 夹 (+1): me(pi) - enemy(pi+1) - me(pi+2)
        if (pi + 2 < L.length) {
            const [ax, ay] = L[pi + 1];
            const [bx, by] = L[pi + 2];
            if (boardState[ax][ay] === enemy && boardState[bx][by] === player) {
                caps.push([ax, ay]);
            }
        }
        // 夹 (-1): me(pi) - enemy(pi-1) - me(pi-2)
        if (pi - 2 >= 0) {
            const [ax, ay] = L[pi - 1];
            const [bx, by] = L[pi - 2];
            if (boardState[ax][ay] === enemy && boardState[bx][by] === player) {
                caps.push([ax, ay]);
            }
        }
        // 挑: enemy(pi-1) - me(pi) - enemy(pi+1)
        if (pi - 1 >= 0 && pi + 1 < L.length) {
            const [ax, ay] = L[pi - 1];
            const [bx, by] = L[pi + 1];
            if (boardState[ax][ay] === enemy && boardState[bx][by] === enemy) {
                caps.push([ax, ay], [bx, by]);
            }
        }
    }

    // Deduplicate
    const seen = new Set();
    return caps.filter(([cx, cy]) => {
        const k = cx * GRID + cy;
        if (seen.has(k)) return false;
        seen.add(k);
        return true;
    });
}

function sleep(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
}

function ensureAudioContext() {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return null;
    if (!audioCtx) {
        audioCtx = new AudioCtx();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    return audioCtx;
}

function playMoveSound() {
    const context = ensureAudioContext();
    if (!context) return;

    const now = context.currentTime;
    const osc = context.createOscillator();
    const gain = context.createGain();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(480, now);
    osc.frequency.exponentialRampToValueAtTime(260, now + 0.05);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.14, now + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);

    osc.connect(gain);
    gain.connect(context.destination);

    osc.start(now);
    osc.stop(now + 0.1);
}

function playCaptureSound(captureCount = 1) {
    const context = ensureAudioContext();
    if (!context) return;

    const now = context.currentTime;
    const osc = context.createOscillator();
    const gain = context.createGain();
    const countFactor = Math.min(captureCount, 4);

    osc.type = 'square';
    osc.frequency.setValueAtTime(360 + countFactor * 20, now);
    osc.frequency.exponentialRampToValueAtTime(230, now + 0.12);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.12 + countFactor * 0.01, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);

    osc.connect(gain);
    gain.connect(context.destination);
    osc.start(now);
    osc.stop(now + 0.15);
}

function playWinSound() {
    const context = ensureAudioContext();
    if (!context) return;

    const now = context.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.5];

    notes.forEach((freq, index) => {
        const start = now + index * 0.11;
        const end = start + 0.2;
        const osc = context.createOscillator();
        const gain = context.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, start);

        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.12, start + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, end);

        osc.connect(gain);
        gain.connect(context.destination);
        osc.start(start);
        osc.stop(end + 0.01);
    });
}

function updatePieceCounts() {
    let bc = 0, wc = 0;
    for (let x = 0; x < GRID; x++) {
        for (let y = 0; y < GRID; y++) {
            if (board[x][y] === BLACK) bc++;
            if (board[x][y] === WHITE) wc++;
        }
    }
    blackCountEl.textContent = bc;
    whiteCountEl.textContent = wc;
    return { bc, wc };
}

function getAllPossibleMoves(player) {
    const moves = [];
    for (let x = 0; x < GRID; x++) {
        for (let y = 0; y < GRID; y++) {
            if (board[x][y] !== player) continue;
            const toList = getValidMoves(x, y);
            for (const [tx, ty] of toList) {
                moves.push({ fx: x, fy: y, tx, ty });
            }
        }
    }
    return moves;
}

function estimateCaptureCountAfterMove(move, player) {
    const boardCopy = board.map((col) => col.slice());
    boardCopy[move.fx][move.fy] = EMPTY;
    boardCopy[move.tx][move.ty] = player;

    let captured = 0;
    let queue = [[move.tx, move.ty]];
    while (queue.length > 0) {
        const next = [];
        const seen = new Set();
        for (const [qx, qy] of queue) {
            const caps = findCapturesOnBoard(boardCopy, qx, qy, player);
            for (const [cx, cy] of caps) {
                const key = cx * GRID + cy;
                if (boardCopy[cx][cy] !== player && !seen.has(key)) {
                    seen.add(key);
                    boardCopy[cx][cy] = player;
                    captured++;
                    next.push([cx, cy]);
                }
            }
        }
        queue = next;
    }
    return captured;
}

function chooseAiMove(player) {
    const moves = getAllPossibleMoves(player);
    if (moves.length === 0) return null;

    const center = 2;
    let bestScore = -Infinity;
    let bestMoves = [];

    for (const move of moves) {
        const captureCount = estimateCaptureCountAfterMove(move, player);
        const centerDistance = Math.abs(move.tx - center) + Math.abs(move.ty - center);
        const progress = player === WHITE ? (move.ty < move.fy ? 1 : 0) : (move.ty > move.fy ? 1 : 0);
        const score = captureCount * 100 - centerDistance * 2 + progress;

        if (score > bestScore) {
            bestScore = score;
            bestMoves = [move];
        } else if (score === bestScore) {
            bestMoves.push(move);
        }
    }

    return bestMoves[Math.floor(Math.random() * bestMoves.length)];
}

async function triggerAiMoveIfNeeded() {
    if (gameOver || isAnimating || aiThinking || !isAiTurn()) return;

    aiThinking = true;
    isAnimating = true;
    selPiece = null;
    validMoves = [];
    updateUI();
    draw();

    await sleep(450);
    const move = chooseAiMove(aiColor);
    if (!move) {
        aiThinking = false;
        isAnimating = false;
        checkNoMoveLossForCurrentPlayer();
        draw();
        return;
    }

    await doMove(move.fx, move.fy, move.tx, move.ty);
    aiThinking = false;
    isAnimating = false;
    if (!gameOver) updateUI();
    draw();
}

function getAnimTarget(x, y) {
    if (!animCapture) return null;
    return animCapture.targets.some(([tx, ty]) => tx === x && ty === y) ? animCapture : null;
}

async function playCaptureStep(targets, player, stepNo) {
    if (targets.length === 0) return;

    statusEl.textContent = `连锁第${stepNo}步：即将吃子 ${targets.length} 枚`;
    draw();
    await sleep(ANIM_STEP_START_DELAY);

    for (let i = 0; i < ANIM_FLASH_COUNT; i++) {
        animCapture = {
            type: 'gray-flash',
            stepNo,
            targets,
            grayOn: i % 2 === 0
        };
        statusEl.textContent = `连锁第${stepNo}步：吃子 ${targets.length} 枚`;
        draw();
        await sleep(ANIM_FLASH_INTERVAL);
    }

    for (const [cx, cy] of targets) {
        board[cx][cy] = player;
    }
    playCaptureSound(targets.length);
    updatePieceCounts();

    animCapture = {
        type: 'converted',
        stepNo,
        targets,
        grayOn: false
    };
    statusEl.textContent = `连锁第${stepNo}步：已转换 ${targets.length} 枚`;
    draw();
    await sleep(ANIM_CONVERT_HOLD);

    animCapture = null;
    draw();
    await sleep(ANIM_STEP_GAP);
}

async function doMove(fx, fy, tx, ty) {
    const player = board[fx][fy];
    board[fx][fy] = EMPTY;
    board[tx][ty] = player;
    lastMove = { fx, fy, tx, ty };
    playMoveSound();
    draw();
    await sleep(120);

    // Capture chain reaction (BFS, step-by-step)
    let queue = [[tx, ty]];
    let stepNo = 1;
    while (queue.length > 0) {
        const seen = new Set();
        const next = [];
        for (const [qx, qy] of queue) {
            const caps = findCaptures(qx, qy, player);
            for (const [cx, cy] of caps) {
                const key = cx * GRID + cy;
                if (board[cx][cy] !== player && !seen.has(key)) {
                    seen.add(key);
                    next.push([cx, cy]);
                }
            }
        }
        await playCaptureStep(next, player, stepNo);
        queue = next;
        stepNo++;
    }

    const { bc, wc } = updatePieceCounts();

    if (bc === 0) { endGame('白方获胜！', WHITE); return; }
    if (wc === 0) { endGame('黑方获胜！', BLACK); return; }

    curPlayer = curPlayer === BLACK ? WHITE : BLACK;
    selPiece = null;
    validMoves = [];

    // Check if current player can move
    if (checkNoMoveLossForCurrentPlayer()) {
        return;
    }

    updateUI();
}

function hasAnyMove(player) {
    for (let x = 0; x < GRID; x++)
        for (let y = 0; y < GRID; y++)
            if (board[x][y] === player && getValidMoves(x, y).length > 0)
                return true;
    return false;
}

function checkNoMoveLossForCurrentPlayer() {
    if (gameOver) return true;
    if (hasAnyMove(curPlayer)) return false;
    const loser = curPlayer === BLACK ? '黑方' : '白方';
    const winner = curPlayer === BLACK ? '白方' : '黑方';
    const winnerPiece = curPlayer === BLACK ? WHITE : BLACK;
    endGame(`${loser}所有棋子均无法移动，${winner}获胜！`, winnerPiece);
    return true;
}

function startWinAnimationLoop() {
    if (winAnimRaf) return;
    const tick = () => {
        if (!gameOver || !winAnim) {
            winAnimRaf = null;
            return;
        }
        draw();
        winAnimRaf = requestAnimationFrame(tick);
    };
    winAnimRaf = requestAnimationFrame(tick);
}

function endGame(msg, winnerPiece = null) {
    if (gameOver) return;
    gameOver = true;
    isAnimating = false;
    playWinSound();
    if (winnerPiece === BLACK || winnerPiece === WHITE) {
        winAnim = { winner: winnerPiece, startTime: performance.now() };
        startWinAnimationLoop();
    }
    modalTitleEl.textContent = msg;
    overlayEl.classList.add('show');
    updateUI();
}

function updateUI() {
    if (gameOver) {
        statusEl.textContent = '游戏结束';
    } else if (isAnimating) {
        if (aiThinking) {
            statusEl.textContent = '白方思考中...';
        }
        return;
    } else {
        if (gameMode === 'online') {
            if (!onlineConnected) {
                statusEl.textContent = '在线模式：请先连接房间';
            } else if (onlinePlayersCount < 2) {
                statusEl.textContent = '在线模式：等待另一位玩家加入';
            } else if (onlinePlayerColor == null) {
                statusEl.textContent = '在线模式：同步中...';
            } else {
                const myColorName = onlinePlayerColor === BLACK ? '黑方' : '白方';
                if (curPlayer === onlinePlayerColor) {
                    statusEl.textContent = `轮到你（${myColorName}）走棋`;
                } else {
                    statusEl.textContent = '对方走棋中...';
                }
            }
        } else if (isAiTurn()) {
            statusEl.textContent = '白方思考中...';
        } else {
            statusEl.textContent = (curPlayer === BLACK ? '黑方' : '白方') + '走棋';
        }
    }
    blackSideEl.classList.toggle('active', curPlayer === BLACK && !gameOver);
    whiteSideEl.classList.toggle('active', curPlayer === WHITE && !gameOver);
}

// ========== Rendering ==========

let hoverPt = null;

function drawWinAnimation() {
    if (!gameOver || !winAnim) return;

    const now = performance.now();
    const elapsed = (now - winAnim.startTime) / 1000;
    const pulse = 0.5 + 0.5 * Math.sin(elapsed * 6.2);
    const winner = winAnim.winner;

    for (let x = 0; x < GRID; x++) {
        for (let y = 0; y < GRID; y++) {
            if (board[x][y] !== winner) continue;
            const [sx, sy] = g2s(x, y);
            ctx.beginPath();
            ctx.arc(sx, sy, RADIUS + 8 + pulse * 5, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 215, 0, ${0.35 + pulse * 0.45})`;
            ctx.lineWidth = 2.5;
            ctx.stroke();
        }
    }

    const particleCount = 22;
    for (let i = 0; i < particleCount; i++) {
        const px = ((elapsed * 120 + i * 37) % (CANVAS_CSS + 40)) - 20;
        const py = ((elapsed * 85 + i * 57) % (CANVAS_CSS + 40)) - 20;
        const r = 2 + (i % 3);
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${(i * 37 + elapsed * 90) % 360}, 95%, 62%, 0.8)`;
        ctx.fill();
    }

    const bannerText = winner === BLACK ? '黑方胜利' : '白方胜利';
    const bannerW = 220;
    const bannerH = 40;
    const bx = (CANVAS_CSS - bannerW) / 2;
    const by = 12;
    ctx.fillStyle = 'rgba(45, 35, 20, 0.75)';
    ctx.fillRect(bx, by, bannerW, bannerH);
    ctx.strokeStyle = 'rgba(255, 215, 0, 0.9)';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bannerW, bannerH);
    ctx.fillStyle = '#ffe082';
    ctx.font = 'bold 22px Microsoft YaHei';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(bannerText, bx + bannerW / 2, by + bannerH / 2);
}

function draw() {
    const W = CANVAS_CSS, H = CANVAS_CSS;

    // Background
    ctx.fillStyle = '#dcb35c';
    ctx.fillRect(0, 0, W, H);

    // Subtle wood grain effect
    ctx.fillStyle = 'rgba(180, 140, 60, 0.15)';
    for (let i = 0; i < W; i += 6) {
        ctx.fillRect(i, 0, 2, H);
    }

    ctx.strokeStyle = '#5a4a2a';
    ctx.lineWidth = 1.5;
    ctx.lineCap = 'round';

    // Horizontal lines
    for (let y = 0; y < GRID; y++) {
        const [x1, y1] = g2s(0, y);
        const [x2, y2] = g2s(4, y);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    // Vertical lines
    for (let x = 0; x < GRID; x++) {
        const [x1, y1] = g2s(x, 0);
        const [x2, y2] = g2s(x, 4);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    // Diagonal lines (per cell)
    for (let cx = 0; cx < 4; cx++) {
        for (let cy = 0; cy < 4; cy++) {
            let sx1, sy1, sx2, sy2;
            if ((cx + cy) % 2 === 0) {
                // '/' in game coords: bottom-left to top-right
                [sx1, sy1] = g2s(cx, cy);
                [sx2, sy2] = g2s(cx + 1, cy + 1);
            } else {
                // '\' in game coords: top-left to bottom-right
                [sx1, sy1] = g2s(cx, cy + 1);
                [sx2, sy2] = g2s(cx + 1, cy);
            }
            ctx.beginPath(); ctx.moveTo(sx1, sy1); ctx.lineTo(sx2, sy2); ctx.stroke();
        }
    }

    // Small dots at empty intersections
    for (let x = 0; x < GRID; x++) {
        for (let y = 0; y < GRID; y++) {
            if (board[x][y] !== EMPTY) continue;
            const [sx, sy] = g2s(x, y);
            ctx.beginPath();
            ctx.arc(sx, sy, 3, 0, Math.PI * 2);
            ctx.fillStyle = '#6b5b3a';
            ctx.fill();
        }
    }

    // Valid move indicators
    for (const [mx, my] of validMoves) {
        const [sx, sy] = g2s(mx, my);
        ctx.beginPath();
        ctx.arc(sx, sy, 12, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(76, 175, 80, 0.45)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(76, 175, 80, 0.8)';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    // Hover highlight
    if (hoverPt && !gameOver) {
        const [hx, hy] = hoverPt;
        const [sx, sy] = g2s(hx, hy);
        if (board[hx][hy] === curPlayer) {
            // Hovering own piece
            ctx.beginPath();
            ctx.arc(sx, sy, RADIUS + 6, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 200, 0, 0.35)';
            ctx.lineWidth = 3;
            ctx.stroke();
        } else if (board[hx][hy] === EMPTY && validMoves.some(([vx, vy]) => vx === hx && vy === hy)) {
            // Hovering valid target
            ctx.beginPath();
            ctx.arc(sx, sy, 14, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(76, 175, 80, 0.7)';
            ctx.fill();
        }
    }

    // Pieces
    for (let x = 0; x < GRID; x++) {
        for (let y = 0; y < GRID; y++) {
            if (board[x][y] === EMPTY) continue;
            const [sx, sy] = g2s(x, y);
            const piece = board[x][y];
            const anim = getAnimTarget(x, y);

            ctx.beginPath();
            ctx.arc(sx, sy, RADIUS, 0, Math.PI * 2);

            if (anim && anim.type === 'gray-flash' && anim.grayOn) {
                const grad = ctx.createRadialGradient(sx - 5, sy - 5, 2, sx, sy, RADIUS);
                grad.addColorStop(0, '#b5b5b5');
                grad.addColorStop(1, '#6e6e6e');
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.stroke();
            } else if (piece === BLACK) {
                // Black piece with gradient
                const grad = ctx.createRadialGradient(sx - 5, sy - 5, 2, sx, sy, RADIUS);
                grad.addColorStop(0, '#555');
                grad.addColorStop(1, '#111');
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                ctx.stroke();
            } else {
                // White piece with gradient
                const grad = ctx.createRadialGradient(sx - 5, sy - 5, 2, sx, sy, RADIUS);
                grad.addColorStop(0, '#fff');
                grad.addColorStop(1, '#ccc');
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            if (anim && anim.type === 'converted') {
                ctx.beginPath();
                ctx.arc(sx, sy, RADIUS + 4, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.85)';
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            // Last move marker
            if (lastMove && lastMove.tx === x && lastMove.ty === y) {
                ctx.beginPath();
                ctx.arc(sx, sy, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#e53935';
                ctx.fill();
            }
        }
    }

    // Selection ring
    if (selPiece) {
        const [sx, sy] = g2s(selPiece[0], selPiece[1]);
        ctx.beginPath();
        ctx.arc(sx, sy, RADIUS + 5, 0, Math.PI * 2);
        ctx.strokeStyle = '#ff9800';
        ctx.lineWidth = 3;
        ctx.stroke();
    }

    drawWinAnimation();
}

// ========== Event Handlers ==========

canvas.addEventListener('click', async (e) => {
    if (gameOver || isAnimating || !isHumanTurn()) return;
    const rect = canvas.getBoundingClientRect();
    const sx = (e.clientX - rect.left) * (CANVAS_CSS / rect.width);
    const sy = (e.clientY - rect.top) * (CANVAS_CSS / rect.height);
    const pt = s2g(sx, sy);
    if (!pt) return;
    const [gx, gy] = pt;

    if (selPiece) {
        // Check if clicking a valid move target
        if (validMoves.some(([vx, vy]) => vx === gx && vy === gy)) {
            const fromX = selPiece[0];
            const fromY = selPiece[1];
            isAnimating = true;
            await doMove(fromX, fromY, gx, gy);
            isAnimating = false;
            if (!gameOver) updateUI();
            draw();
            if (gameMode === 'online') {
                sendOnlineMessage({
                    type: 'move',
                    roomId: onlineRoomId,
                    move: { fx: fromX, fy: fromY, tx: gx, ty: gy }
                });
            } else {
                await triggerAiMoveIfNeeded();
            }
            return;
        }
        // Click on another own piece → switch selection
        if (board[gx][gy] === curPlayer) {
            selPiece = [gx, gy];
            validMoves = getValidMoves(gx, gy);
            draw();
            return;
        }
        // Click elsewhere → deselect
        selPiece = null;
        validMoves = [];
        draw();
        return;
    }

    // No selection yet → select own piece
    if (board[gx][gy] === curPlayer) {
        selPiece = [gx, gy];
        validMoves = getValidMoves(gx, gy);
        draw();
    }
});

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const sx = (e.clientX - rect.left) * (CANVAS_CSS / rect.width);
    const sy = (e.clientY - rect.top) * (CANVAS_CSS / rect.height);
    const pt = s2g(sx, sy);
    const prev = hoverPt;
    hoverPt = pt;
    // Only redraw if hover point changed
    if (!prev && !pt) return;
    if (prev && pt && prev[0] === pt[0] && prev[1] === pt[1]) return;
    draw();
});

canvas.addEventListener('mouseleave', () => {
    if (hoverPt) { hoverPt = null; draw(); }
});

document.getElementById('restartBtn').addEventListener('click', () => {
    if (gameMode === 'online' && onlineConnected) {
        sendOnlineMessage({ type: 'restart', roomId: onlineRoomId });
    }
    resetBoard();
    triggerAiMoveIfNeeded();
});

document.getElementById('surrenderBtn').addEventListener('click', () => {
    if (gameOver || isAnimating) return;
    const winnerPiece = curPlayer === BLACK ? WHITE : BLACK;
    const winner = curPlayer === BLACK ? '白方' : '黑方';
    if (gameMode === 'online' && onlineConnected) {
        sendOnlineMessage({
            type: 'surrender',
            roomId: onlineRoomId,
            winnerPiece,
            message: (curPlayer === BLACK ? '黑方' : '白方') + '认输，' + winner + '获胜！'
        });
    }
    endGame((curPlayer === BLACK ? '黑方' : '白方') + '认输，' + winner + '获胜！', winnerPiece);
    draw();
});

document.getElementById('playAgainBtn').addEventListener('click', () => {
    if (gameMode === 'online' && onlineConnected) {
        sendOnlineMessage({ type: 'restart', roomId: onlineRoomId });
    }
    resetBoard();
    triggerAiMoveIfNeeded();
});

pvpModeBtn.addEventListener('click', () => {
    if (gameMode === 'pvp') return;
    if (gameMode === 'online') {
        userDisconnect();
        setOnlineTip('未连接');
    }
    gameMode = 'pvp';
    updateModeUI();
    resetBoard();
});

aiModeBtn.addEventListener('click', () => {
    if (gameMode === 'ai') return;
    if (gameMode === 'online') {
        userDisconnect();
        setOnlineTip('未连接');
    }
    gameMode = 'ai';
    updateModeUI();
    resetBoard();
    triggerAiMoveIfNeeded();
});

onlineModeBtn.addEventListener('click', () => {
    if (gameMode === 'online') return;
    gameMode = 'online';
    updateModeUI();
    resetBoard();
    setOnlineTip('在线模式：输入房间号后点「连接房间」（自动连接当前服务器）');
});

connectBtnEl.addEventListener('click', () => {
    connectOnlineRoom();
});

disconnectBtnEl.addEventListener('click', () => {
    userDisconnect();
    setOnlineTip('已手动断开');
    updateUI();
});

advToggleEl.addEventListener('click', () => {
    const hidden = serverInputEl.classList.toggle('adv-hidden');
    advToggleEl.textContent = hidden ? '高级设置 ▾' : '高级设置 ▴';
});

// ========== Init ==========
buildLines();
updateModeUI();
setOnlineConnected(false);
setOnlineTip('未连接');
startPingTimer();
resetBoard();
</script>
